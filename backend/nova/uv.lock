[[package]]
name = "x-blog-backend"
version = "0.1.0"
source = { virtual = "." }
dependencies = [
    { name = "alembic" },
    { name = "bcrypt" },
    { name = "cachetools" },
    { name = "fastapi" },
    { name = "httpx2" },
    { name = "markdown" },
    { name = "pillow" },
    { name = "psycopg2-binary" },
    { name = "pydantic" },
    { name = "pydantic-settings" },
    { name = "pyjwt" },
    { name = "python-dotenv" },
    { name = "python-multipart" },
    { name = "sentry-sdk" },
    { name = "slowapi" },
    { name = "sqlalchemy" },
    { name = "uvicorn", extra = ["standard"] },
]

[package.dev-dependencies]
dev = [
    { name = "pyright" },
    { name = "pytest" },
    { name = "pytest-asyncio" },
    { name = "pytest-cov" },
    { name = "pytest-xdist" },
    { name = "ruff" },
    { name = "rumdl" },
]

