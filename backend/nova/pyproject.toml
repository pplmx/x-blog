[project]
name = "x-blog-backend"
version = "0.1.0"
description = "X-Blog Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.31",
    "psycopg2-binary>=2.9.12",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "cachetools>=5.5.0",
    "sentry-sdk>=2.0.0",
    "alembic>=1.18.5",
    "httpx2>=2.9.1",
    "pillow>=13.0.0",
    "markdown>=3.10.3",
    "pywebpush>=2.4.0",
    "pyotp>=2.10.0",
    "urllib3>=2.8.0",
    "multidict>=6.9.1,<7.0",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
]

# Tool configuration lives in dedicated files, not here:
#   pytest.toml        pytest (testpaths, asyncio mode, addopts)
#   .coveragerc.toml   coverage.py (source, report, exclude_lines)
#   ruff.toml          ruff lint/format (repo root; takes precedence)
#   ty.toml            ty type checker (src scope, overrides)
