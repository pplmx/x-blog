[project]
name = "x-blog-backend"
version = "0.1.0"
description = "X-Blog Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn[standard]>=0.54.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "python-multipart>=0.0.34",
    "psycopg2-binary>=2.9.13",
    "slowapi>=0.1.10",
    "python-dotenv>=1.2.4",
    "cachetools>=8.0.2",
    "sentry-sdk>=2.75.0",
    "alembic>=1.20.1",
    "httpx2>=2.16.2",
    "pillow>=13.0.0",
    "markdown>=3.11.3",
    "pywebpush>=2.5.0",
    "pyotp>=2.12.1",
    "urllib3>=2.8.0",
    "multidict>=6.9.1,<7.0",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
]

# Tool configuration lives in dedicated files, not here:
#   pytest.toml        pytest (testpaths, asyncio mode, addopts)
#   .coveragerc.toml   coverage.py (source, report, exclude_lines)
#   ruff.toml          ruff lint/format (repo root; takes precedence)
#   ty.toml            ty type checker (src scope, overrides)
