[project]
name = "x-blog-backend"
version = "0.1.0"
description = "X-Blog Backend"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.15.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.31",
    "psycopg2-binary>=2.9.12",
    "slowapi>=0.1.9",
    "python-dotenv>=1.0.0",
    "cachetools>=5.5.0",
    "sentry-sdk>=2.0.0",
    "alembic>=1.18.5",
    "httpx2>=2.9.1",
    "pillow>=10.0.0",
    "markdown>=3.10.3",
    "pywebpush>=2.4.0",
    "pyotp>=2.10.0",
    "urllib3>=2.8.0",
    "multidict>=6.9.1,<7.0",
    "asyncpg>=0.32.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=6.0.0",
    "pytest-xdist>=3.8.0",
    "httpx>=0.28.1",
]

[tool.ty]
# Python type checking (Astral `ty`, a global `uv tool` — not a project dep).
# Runs on app/ only (tests/migrations/scripts excluded), matching the previous
# pyright scope. `ty` reads project context from this config.
[tool.ty.src]
include = ["app"]

[tool.ty.environment]
python-version = "3.14"

# RSS/feed handlers type `request: Request = None` (FastAPI injects it; pyright's
# `type: ignore[assignment]` doesn't suppress ty's `invalid-parameter-default`
# for this well-known FastAPI-injection workaround). Suppress that one rule for
# this file only rather than scattering ty-ignore comments.
[[tool.ty.overrides]]
include = ["app/routers/rss.py"]

[tool.ty.overrides.rules]
invalid-parameter-default = "ignore"

# Ruff lint/format config lives in ruff.toml (single source of truth). The
# [tool.ruff] block here was dead config — ruff.toml takes precedence, so the
# pyproject copy silently drifted (line-length 100 vs 120).

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
# pytest-asyncio: the data layer is now async, so tests + fixtures are async.
# auto mode discovers `async def test_*` without a per-test marker, and
# fixture_loop_scope=function keeps each test's AsyncClient/AsyncSession on the
# same (function-scoped) event loop as its assertions.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
# Measure app coverage on every local pytest run so `just test-backend` enforces
# the same gate CI does; source and fail_under live in [tool.coverage.*] below.
addopts = "--cov"
filterwarnings = [
    "ignore::DeprecationWarning:slowapi",
    "ignore::DeprecationWarning:_pytest",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
# The 80% gate is enforced on full runs only (`just test-backend` and CI pass
# --cov-fail-under=80); a filtered `pytest -k ...` iteration run measures but
# must not fail on partial coverage.
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "type: ignore",
    "pragma: no cover",
    # Pydantic excluded patterns
    "if field_value is ...:",
    "raise ValueError",
]
