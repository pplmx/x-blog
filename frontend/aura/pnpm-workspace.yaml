packages:
  - .

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@nuxt/cli@4.0.1"
  - "@nuxt/kit@4.6.1"
  - "@nuxt/nitro-server@4.6.1"
  - "@nuxt/schema@4.6.1"
  - "@nuxt/vite-builder@4.6.1"
  - "@nuxt/vite-server@4.6.1"
  - nuxt@4.6.1

# Force patched versions for transitive advisories tracked on the default
# branch (TASK-196 / ISS-108). All are dev/build-tooling chains; both the
# range and the exact resolved-version overrides are listed so every reporter
# of a vulnerable version is re-mapped (pnpm keeps exact-resolved instances
# unless the exact key is also overridden).
overrides:
  ansi-regex@<6: ^5.0.1
  ansi-regex@5.0.0: 5.0.1
  ini@<2: ^1.3.6
  ini@1.3.4: 1.3.6
  nanoid@<3.3.18: ^3.3.18
  nanoid@3.3.16: 3.3.18
  postcss: ^8.5.23
  postcss@8.5.22: 8.5.23
  # Vite+ toolchain: unify on its bundled Vite core + Vitest so plugins,
  # dependencies, and `vp test` all share a single copy (see viteplus.dev local-cli).
  vite@*: npm:@voidzero-dev/vite-plus-core@1.1.0
  vitest@*: 5.0.3
