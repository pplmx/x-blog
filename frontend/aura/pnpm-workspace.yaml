packages:
  - .

allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - "@nuxt/cli@4.0.1"
  - "@nuxt/kit@4.6.1"
  - "@nuxt/nitro-server@4.6.1"
  - "@nuxt/schema@4.6.1"
  - "@nuxt/vite-builder@4.6.1"
  - "@nuxt/vite-server@4.6.1"
  - nuxt@4.6.1

# Force patched versions for transitive advisories tracked on the default
# branch. All are dev/build-tooling chains; both the
# range and the exact resolved-version overrides are listed so every reporter
# of a vulnerable version is re-mapped (pnpm keeps exact-resolved instances
# unless the exact key is also overridden).
overrides:
  ansi-regex@<6: ^5.0.1
  ansi-regex@5.0.0: 5.0.1
  fflate@<0.8.3: 0.8.3
  fflate@0.7.3: 0.8.3
  glob@<14.0.2: 14.0.6
  glob@13.0.6: 14.0.2
  ini@<2: ^1.3.6
  ini@1.3.4: 1.3.6
  minimatch@<11.0.1: 11.0.1
  minimatch@10.2.6: 11.0.1
  nanoid@<3.3.18: ^3.3.18
  nanoid@3.3.16: 3.3.18
  postcss: ^8.5.23
  postcss@8.5.22: 8.5.23
  # Vite+ toolchain: unify on its bundled Vite core + Vitest so plugins,
  # dependencies, and `vp test` all share a single copy (see viteplus.dev local-cli).
  # The versions live in the `catalog` block below, which `vp migrate` owns.
  vite@*: "catalog:"
  vitest@*: "catalog:"

# One version per Vite+ tool, referenced as "catalog:" from package.json and the
# overrides above — the shape `vp migrate` generates, so a toolchain bump is a
# single-line change here instead of three files drifting apart.
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest: 5.1.0
  vite-plus: 1.7.0
  "@vitest/coverage-v8": 5.1.0

# Nuxt plugins peer-declare `vitest`, while the runner is vite-plus' bundled copy
# at the catalog version; allow that mismatch instead of installing a second copy.
peerDependencyRules:
  allowAny:
    - vitest
  allowedVersions:
    vitest: "*"
