default_install_hook_types:
    - pre-commit
    - commit-msg

default_stages:
    - pre-commit

fail_fast: true

repos:
    - repo: builtin
      hooks:
          - id: end-of-file-fixer
          - id: trailing-whitespace
            exclude: \.md$
          - id: check-toml
          - id: check-yaml
            # pnpm 12 writes pnpm-lock.yaml as multi-document YAML
            # (lockfileVersion '9.0', two `---` docs); check-yaml only accepts
            # a single document. The lockfile is machine-generated — skip it.
            exclude: pnpm-lock\.yaml$
          - id: check-merge-conflict
          - id: mixed-line-ending
            args: ["--fix=lf"]

    - repo: https://github.com/commitizen-tools/commitizen
      rev: v4.16.5
      hooks:
          - id: commitizen
          - id: commitizen-branch
            stages: [pre-push]

    - repo: https://github.com/rvben/rumdl-pre-commit
      rev: v0.2.43
      hooks:
          - id: rumdl
            args: [--fix]
          - id: rumdl-fmt
