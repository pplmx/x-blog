events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log  /var/log/nginx/access.log;
    error_log   /var/log/nginx/error.log;

    # Admin image uploads go through /api/ to the backend, whose cap is 5MB
    # (app/routers/upload.py MAX_SIZE) with the Nuxt proxy allowing 6MB.
    # nginx's default is 1m — without raising it, 1-5MB uploads 413 here
    # before the backend's limit is ever consulted. 6m = 5MB content plus
    # multipart framing. (RIL TASK-041, ISS-028)
    client_max_body_size 6m;

    # Backing store for the STATIC zone used by the Nuxt SSR cache below.
    # Without proxy_cache_path the `proxy_cache STATIC` reference is a fatal
    # [emerg] "zone STATIC is not found" at startup. The directory must exist
    # and be writable by the nginx worker user (e.g. www-data).
    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=STATIC:10m max_size=1g inactive=60m use_temp_path=off;

    # Proxy to backend API
    upstream backend {
        server 127.0.0.1:18888;
    }

    # Proxy to Nuxt frontend
    upstream frontend {
        server 127.0.0.1:34567;
    }

    server {
        listen 80;
        server_name your-domain.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name your-domain.com;

        ssl_certificate     /etc/ssl/certs/your-domain.crt;
        ssl_certificate_key /etc/ssl/private/your-domain.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # Security headers
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;
        # X-XSS-Protection is deliberately NOT set: the legacy XSS auditor it
        # enables was removed from all modern browsers and could itself be
        # abused in old Edge (OWASP/MDN now recommend omitting it).
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Uploaded files (served directly by nginx, bypass backend)
        location /static/uploads/ {
            alias /var/www/x-blog/uploads/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            # add_header inheritance drops the server-level headers here, so
            # re-assert them; uploads are image-only but defense-in-depth
            # (nosniff, X-Frame-Options, HSTS all resend on the response).
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
            default_type application/octet-stream;
            access_log off;
        }

        # Backend API
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # FastAPI's auto-generated API docs (/docs, /redoc, /openapi.json)
        # expose the full admin schema to anyone. They are dev aids; do not
        # proxy them at the public edge — return 404 instead of leaking the
        # schema. API docs stay usable on the backend's own bind (127.0.0.1:18888).
        # (RIL TASK-042, ISS-029)
        location = /docs { return 404; }
        location = /redoc { return 404; }
        location = /openapi.json { return 404; }

        # Backend health
        location /health {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Backend RSS / SEO routes
        location /rss/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /robots.txt {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        location /sitemap.xml {
            proxy_pass http://backend;
            proxy_set_header Host $host;
        }

        # Everything else → Nuxt frontend
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;

            # Nuxt SSR cache
            proxy_cache STATIC;
            proxy_cache_valid 200 1m;
            proxy_cache_use_stale error timeout updating;
        }
    }
}
