name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/nova/uv.lock

      - name: Backend lint, format, and markdown check
        run: |
          cd backend/nova
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          cd ../..
          # rumdl gates the maintained markdown docs (superpowers plans/specs are
          # excluded via .rumdl.toml). Run from the repo root so .rumdl.toml and
          # the tracked docs are scanned, using the project-pinned rumdl.
          uv run --project backend/nova rumdl check .

      - name: Backend type check (pyright)
        run: |
          cd backend/nova
          uv run pyright

      - name: Backend dependency vulnerability audit
        run: |
          cd backend/nova
          # Fail the build on any known vulnerability in the resolved dependency
          # tree (uv audit exits non-zero when vulnerabilities are found).
          uv audit

      - name: Verify alembic baseline builds a fresh DB (no model drift)
        run: |
          cd backend/nova
          DATABASE_URL=sqlite:///./_mig_check.db JWT_SECRET_KEY=ci uv run alembic upgrade head
          DATABASE_URL=sqlite:///./_mig_check.db JWT_SECRET_KEY=ci uv run alembic check
          rm -f _mig_check.db

      - name: Backend tests with coverage
        run: |
          cd backend/nova
          uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # Run the whole backend suite against real PostgreSQL — the deployment
  # dialect (DEC-216, round 211). The SQLite-only suite never exercised the
  # PG-only branches (tsvector @@, ts_headline, pg advisory locks) nor the
  # naive-UTC/String(N) semantics, and silently passes tests that assumed
  # SQLite id-reuse. conftest gives each xdist worker its own schema on the
  # shared service container, so -n 8 is safe and bounded.
  backend-test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: xblog_test
          POSTGRES_USER: xblog
          POSTGRES_PASSWORD: xblog
        options: >-
          --health-cmd "pg_isready -U xblog -d xblog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/nova/uv.lock

      - name: Backend tests against PostgreSQL
        run: |
          cd backend/nova
          TEST_DATABASE_URL="postgresql://xblog:xblog@localhost:5432/xblog_test" \
          uv run pytest -n 8 --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/aura/pnpm-lock.yaml

      - name: Frontend lint, typecheck, and build
        run: |
          cd frontend/aura
          pnpm install
          pnpm lint
          pnpm typecheck
          pnpm build

      - name: Frontend tests with coverage
        run: |
          cd frontend/aura
          # `pnpm test -- --coverage` would pass --coverage as a positional
          # filter (the -- separator) so coverage never ran — the gate was
          # latent. `pnpm test --coverage` forwards it as a real vitest flag.
          pnpm test --coverage

  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: xblog_test
          POSTGRES_USER: xblog
          POSTGRES_PASSWORD: xblog
        options: >-
          --health-cmd "pg_isready -U xblog -d xblog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11'

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: frontend/aura/pnpm-lock.yaml

      - name: Setup uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/nova/uv.lock

      - name: Seed database
        run: |
          cd backend/nova
          uv sync
          DATABASE_URL="postgresql://xblog:xblog@localhost:5432/xblog_test" \
          APP_ENV=development \
          ADMIN_PASSWORD=admin123 \
          uv run python scripts/init_db.py

      - name: Start backend
        run: |
          cd backend/nova
          # Generate a throwaway ES256 (P-256) VAPID keypair so the Web Push
          # e2e surfaces the subscribe button and can verify the API contract
          # (DEC-055). The keys exist only for this job's lifetime.
          read -r VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY <<< "$(uv run python -c 'import base64; from cryptography.hazmat.primitives.asymmetric import ec; k=ec.generate_private_key(ec.SECP256R1()); p=k.public_key().public_numbers(); print(base64.urlsafe_b64encode(b"\x04"+p.x.to_bytes(32,\"big\")+p.y.to_bytes(32,\"big\")).rstrip(b\"=\").decode(), base64.urlsafe_b64encode(k.private_numbers().private_value.to_bytes(32,\"big\")).rstrip(b\"=\").decode())')"
          export VAPID_PUBLIC_KEY VAPID_PRIVATE_KEY VAPID_SUBJECT=mailto:e2e@example.com
          DATABASE_URL="postgresql://xblog:xblog@localhost:5432/xblog_test" \
          JWT_SECRET_KEY="test-secret-key-e2e" \
          RATE_LIMIT_AUTH_PER_MINUTE=1000 \
          uv run uvicorn app.main:app --host 0.0.0.0 --port 18888 &
          sleep 3
          curl -sf http://localhost:18888/health > /dev/null || (echo "Backend failed" && exit 1)

      - name: Install frontend dependencies
        run: |
          cd frontend/aura
          pnpm install

      - name: Install Playwright browser
        run: |
          cd frontend/aura
          pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          # Playwright's webServer (port 34567, per playwright.config.ts) inherits these.
          # The browser must stay same-origin; only the server-side proxy target
          # may point at the backend port directly.
          NUXT_PROXY_TARGET: http://localhost:18888
          NUXT_SITE_URL: http://localhost:34567
        run: |
          cd frontend/aura
          pnpm test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts
          path: frontend/aura/test-results/
          if-no-files-found: ignore
