name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install uv
        run: pip install uv

      - name: Backend lint and format check
        run: |
          cd backend/nova
          uv sync
          uvx ruff check .
          uvx ruff format --check .

      - name: Backend tests with coverage
        run: |
          cd backend/nova
          uv run pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '9'

      - name: Frontend lint check
        run: |
          cd frontend/aura
          pnpm install
          pnpm lint

      - name: Frontend tests
        run: |
          cd frontend/aura
          pnpm install
          pnpm test
