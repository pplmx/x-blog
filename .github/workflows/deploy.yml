name: Deploy

on:
  workflow_run:
    workflows: [Test]
    types: [completed]

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  build-and-push:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend-image: ${{ format('ghcr.io/{0}/backend@{1}', github.repository, steps.backend.outputs.digest) }}
      frontend-image: ${{ format('ghcr.io/{0}/frontend@{1}', github.repository, steps.frontend.outputs.digest) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend
        id: backend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./backend/nova
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ github.event.workflow_run.head_sha }}

      - name: Build and push frontend
        id: frontend
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./frontend/aura
          push: true
          tags: ghcr.io/${{ github.repository }}/frontend:${{ github.event.workflow_run.head_sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    permissions:
      packages: read
    steps:
      - name: SSH to server
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SERVER_KNOWN_HOSTS: ${{ secrets.SERVER_KNOWN_HOSTS }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
          BACKEND_IMAGE: ${{ needs.build-and-push.outputs.backend-image }}
          FRONTEND_IMAGE: ${{ needs.build-and-push.outputs.frontend-image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -eu
          SSH_DIR="$(mktemp -d)"
          cleanup_ssh() {
            rm -rf "$SSH_DIR"
          }
          trap cleanup_ssh EXIT
          printf '%s\n' "$SSH_KEY" > "$SSH_DIR/key"
          printf '%s\n' "$SERVER_KNOWN_HOSTS" > "$SSH_DIR/known_hosts"
          chmod 600 "$SSH_DIR/key" "$SSH_DIR/known_hosts"
          {
            printf '%s\n' "$DEPLOY_SHA" "$BACKEND_IMAGE" "$FRONTEND_IMAGE" "$GHCR_USER" "$GHCR_TOKEN"
            cat <<'REMOTE_SCRIPT'
          set -eu
          cd /opt/x-blog
          git fetch origin main
          CURRENT_MAIN="$(git rev-parse FETCH_HEAD)"
          if [ "$DEPLOY_SHA" != "$CURRENT_MAIN" ]; then
            echo "Skipping stale commit $DEPLOY_SHA; main is $CURRENT_MAIN"
            exit 0
          fi
          git checkout --detach "$DEPLOY_SHA"
          DOCKER_CONFIG="$(mktemp -d)"
          export DOCKER_CONFIG
          cleanup_docker() {
            docker logout ghcr.io >/dev/null 2>&1 || true
            rm -rf "$DOCKER_CONFIG"
          }
          trap cleanup_docker EXIT
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
          export BACKEND_IMAGE FRONTEND_IMAGE
          docker compose pull backend frontend
          docker compose up -d --no-build --remove-orphans --wait --wait-timeout 120
          docker image prune -f
          REMOTE_SCRIPT
          } | ssh \
            -i "$SSH_DIR/key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$SSH_DIR/known_hosts" \
            "$SERVER_USER@$SERVER_HOST" \
            'read -r DEPLOY_SHA; read -r BACKEND_IMAGE; read -r FRONTEND_IMAGE; read -r GHCR_USER; read -r GHCR_TOKEN; export DEPLOY_SHA BACKEND_IMAGE FRONTEND_IMAGE GHCR_USER GHCR_TOKEN; sh -s'
