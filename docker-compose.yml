services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: xblog
      POSTGRES_USER: xblog
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xblog}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xblog -d xblog"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend/nova
      target: production
    ports:
      - "18888:18888"
    environment:
      DATABASE_URL: postgresql://xblog:${POSTGRES_PASSWORD:-xblog}@postgres:5432/xblog
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in your .env file}
      ALLOWED_ORIGINS: http://localhost:34567,http://frontend:3000
      RATE_LIMIT_PER_MINUTE: "60"
      GZIP_MINIMUM_SIZE: "500"
    volumes:
      - uploads:/app/static/uploads
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:18888/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend/aura
      target: runner
    ports:
      - "34567:3000"
    environment:
      # Browser API requests stay same-origin (/api/* → Nuxt server → proxy).
      # NUXT_API_URL must NOT be set here: it is baked into the client bundle
      # and browsers cannot resolve the docker-internal `backend` hostname,
      # which broke every search/API call with a wrong URL.
      NUXT_PROXY_TARGET: http://backend:18888
      NUXT_SITE_URL: http://localhost:34567
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  uploads:
